<svg width="100%" viewBox="0 0 680 390" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Alatike Pro logo with Yoruba diacritics and English tagline</title>
  <desc>Luxury dark emblem logo for Alatike Pro with bold Yoruba accented wordmark and English tagline on deep mocha background</desc>

  <!-- Background -->
  <rect width="680" height="390" fill="#2C2118"/>

  <!-- Inner border frames -->
  <rect x="28" y="22" width="624" height="346" rx="2" fill="none" stroke="#A48D78" stroke-width="1" opacity="0.5"/>
  <rect x="34" y="28" width="612" height="334" rx="2" fill="none" stroke="#CBB9A4" stroke-width="0.5" opacity="0.35"/>

  <!-- ── TOP ARC ORNAMENT ── -->
  <path d="M255 128 Q340 72 425 128" fill="none" stroke="#CBB9A4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Three dots on arc -->
  <circle cx="287" cy="108" r="3.5" fill="#CBB9A4"/>
  <circle cx="340" cy="89" r="5" fill="#CBB9A4"/>
  <circle cx="393" cy="108" r="3.5" fill="#CBB9A4"/>

  <!-- Tick lines between dots -->
  <line x1="313" y1="98" x2="314" y2="105" stroke="#CBB9A4" stroke-width="1" stroke-linecap="round"/>
  <line x1="367" y1="98" x2="366" y2="105" stroke="#CBB9A4" stroke-width="1" stroke-linecap="round"/>

  <!-- Horizontal rules flanking arc -->
  <line x1="80" y1="128" x2="247" y2="128" stroke="#CBB9A4" stroke-width="0.8"/>
  <line x1="433" y1="128" x2="600" y2="128" stroke="#CBB9A4" stroke-width="0.8"/>
  <circle cx="80" cy="128" r="2.5" fill="#A48D78"/>
  <circle cx="600" cy="128" r="2.5" fill="#A48D78"/>

  <!-- ── MAIN WORDMARK — Yoruba diacritics — BOLDER ── -->
  <!-- Shadow layer -->
  <text x="343" y="222" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="66" font-weight="700" letter-spacing="10"
        fill="#A48D78" opacity="0.18">ÀLÁTIKẸ</text>
  <!-- Main text -->
  <text x="340" y="219" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="66" font-weight="700" letter-spacing="10"
        fill="#E6DAC8">ÀLÁTIKẸ</text>

  <!-- ── DIVIDER ── -->
  <line x1="80" y1="246" x2="314" y2="246" stroke="#A48D78" stroke-width="1"/>
  <polygon points="340,238 351,246 340,254 329,246" fill="#A48D78"/>
  <line x1="366" y1="246" x2="600" y2="246" stroke="#A48D78" stroke-width="1"/>

  <!-- ── PRO — much bolder and larger ── -->
  <text x="340" y="282" text-anchor="middle"
        font-family="Raleway, 'Helvetica Neue', sans-serif"
        font-size="15" font-weight="700" letter-spacing="13"
        fill="#C4A882">PRO</text>



  <!-- Bottom ornament — directly under PRO -->
  <line x1="272" y1="298" x2="322" y2="298" stroke="#A48D78" stroke-width="0.6" opacity="0.6"/>
  <circle cx="340" cy="298" r="2.5" fill="#A48D78" opacity="0.7"/>
  <line x1="358" y1="298" x2="408" y2="298" stroke="#A48D78" stroke-width="0.6" opacity="0.6"/>
</svg>
